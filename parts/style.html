<style>
  body{margin:0;font-family:'Work Sans',sans-serif;background:#FBF7EC;color:#161611;}
  a{color:inherit;text-decoration:none;}
  .eyebrow{font-family:'Work Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;}
  .card-link{transition:opacity .15s ease;}
  .card-link:hover{opacity:0.86;}
  .tool-icon{
    width:40px;height:40px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .tool-icon img{
    width:40px;height:40px;
    display:block;
  }

  @media (max-width:700px){
    html{-webkit-text-size-adjust:100%;}
    body{min-width:320px; overflow-x:hidden;}
    .eyebrow{font-size:12px; letter-spacing:.12em; line-height:1.35;}

    #top_bar > div{padding:18px 20px !important;}
    #top_bar a{display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:12px 18px !important; font-size:12px;}

    #hero > div{padding:18px 20px 34px !important;}
    #hero h1{font-size:clamp(42px,12vw,54px) !important; line-height:1.02 !important;}
    #hero h1 + div{width:12px !important; height:12px !important; margin-bottom:7px !important;}
    #hero .eyebrow{margin-top:16px !important; max-width:260px;}

    #role_bar > div{padding:24px 20px !important; align-items:flex-start !important; gap:24px !important;}
    #role_bar > div > div:first-child{gap:10px !important;}
    #role_bar .tool-icon{width:44px; height:44px; border-radius:10px;}
    #role_bar .tool-icon img{width:44px; height:44px;}
    #role_bar > div > div:last-child{text-align:left !important; width:100%; display:grid !important; grid-template-columns:1fr auto; align-items:end;}
    #role_bar > div > div:last-child > div:last-child{justify-content:flex-end !important; margin-top:0 !important;}

    #category_strip > div{flex-wrap:nowrap !important; overflow-x:auto; -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity;}
    #category_strip > div > div{flex:0 0 auto !important; min-width:172px; padding:18px 20px !important; scroll-snap-align:start;}

    #home > div:first-child{padding:32px 20px !important;}
    #home > div:first-child p{font-size:18px !important; line-height:1.58 !important;}
    #home > div:nth-child(2){grid-template-columns:1fr !important; gap:2px !important;}
    #home > div:nth-child(2) > a > div:first-child{height:180px !important;}
    #home > div:nth-child(2) > a > div:last-child{padding:18px 20px 22px !important;}
    #home > div:nth-child(2) > a > div:last-child > div:last-child{margin-top:8px !important;}
    #home > div:nth-child(2) > a > div:last-child > div:last-child > div{font-size:28px !important;}
    #home > div:nth-child(2) span{font-size:26px !important;}

    #home > div:nth-child(3){padding:64px 20px 40px !important;}
    #home > div:nth-child(3) > div:first-child{font-size:104px !important; top:-12px !important; right:-16px !important;}
    #home > div:nth-child(3) h3{font-size:clamp(38px,11vw,48px) !important; line-height:1.05 !important; margin-bottom:32px !important;}
    #home > div:nth-child(3) [style*="gap:18px"]{gap:14px !important;}
    #home input,#home textarea{font-size:16px !important; padding:14px !important; border-radius:4px !important;}
    #home input{min-height:50px;}
    #home textarea{min-height:120px;}
    #home button{width:100%; min-height:50px; font-size:15px !important; padding:14px 20px !important; border-radius:4px !important;}

    #footer > div{padding:24px 20px !important; align-items:flex-start !important; flex-direction:column; gap:16px !important;}
    #footer > div > div:nth-child(2){order:3;}
  }
