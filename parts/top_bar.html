  <script>
    (function () {
      var dd = document.querySelector('.dropdown');
      if (!dd) return;
      var btn = dd.querySelector('.dd-toggle');
      function set(open) {
        dd.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        set(!dd.classList.contains('open'));
      });
      document.addEventListener('click', function (e) {
        if (!dd.contains(e.target)) set(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          set(false);
          if (dd.contains(document.activeElement)) document.activeElement.blur();
        }
      });
      dd.addEventListener('mouseleave', function () { set(false); });
    })();
  </script>
